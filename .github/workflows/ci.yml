name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify:nextgen
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-evaluation-report
          path: |
            artifacts/evaluation-report.json
            artifacts/nextgen-eval.json
            artifacts/nextgen-benchmarks.json
            artifacts/answer-generation.json
            artifacts/benchmark-trend.json
            artifacts/leaderboard.json
          if-no-files-found: ignore

  certified-benchmarks:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run benchmark:certified
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: certified-benchmark-artifacts
          path: artifacts/*.json
          if-no-files-found: error
