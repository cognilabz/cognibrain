name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run verify:ci
      - run: npm run internal -- leaderboard:publish
      - uses: actions/setup-node@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Update npm for trusted publishing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm install -g npm@^11.10.0
      - name: Publish npm package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TRUSTED_PUBLISHING: ${{ vars.NPM_TRUSTED_PUBLISHING }}
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          NPM_LATEST="$(npm dist-tag ls "$PACKAGE_NAME" --registry=https://registry.npmjs.org/ | awk '/^latest: / { print $2 }')"
          export PACKAGE_VERSION NPM_LATEST

          NEXT_VERSION="$(node -e '
            const current = process.env.PACKAGE_VERSION;
            const latest = process.env.NPM_LATEST || "0.0.0";
            const parse = (value) => String(value || "0.0.0").split(/[+-]/)[0].split(".").map((part) => Number(part));
            const compare = (a, b) => {
              for (let i = 0; i < 3; i += 1) {
                const delta = (a[i] || 0) - (b[i] || 0);
                if (delta !== 0) return delta;
              }
              return 0;
            };
            const currentParts = parse(current);
            const latestParts = parse(latest);
            if (compare(currentParts, latestParts) > 0) {
              console.log(current);
            } else {
              latestParts[2] = (latestParts[2] || 0) + 1;
              console.log(latestParts.slice(0, 3).join("."));
            }
          ')"

          if [ "$NEXT_VERSION" != "$PACKAGE_VERSION" ]; then
            npm version "$NEXT_VERSION" --no-git-tag-version
          fi

          echo "Publishing $PACKAGE_NAME@$NEXT_VERSION to npm."
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            if [ "$NPM_TRUSTED_PUBLISHING" != "true" ]; then
              echo "NPM_TOKEN is not set and NPM_TRUSTED_PUBLISHING is not true; skipping npm publish."
              echo "Set the NPM_TOKEN repository secret or configure npm trusted publishing for cognilabz/cognibrain + ci.yml and set NPM_TRUSTED_PUBLISHING=true."
              exit 0
            fi
            echo "NPM_TOKEN is not set; using npm trusted publishing via GitHub OIDC."
          fi
          npm publish --access public
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-evaluation-report
          path: |
            artifacts/evaluation-report.json
            artifacts/nextgen-eval.json
            artifacts/nextgen-benchmarks.json
            artifacts/answer-generation.json
            artifacts/cognicodebench/*.json
            artifacts/plan1_2-audit.json
            artifacts/plan1_3-audit.json
            artifacts/status-verification.json
            artifacts/vendor-live-smoke.json
            artifacts/selfhosted-verification.json
            artifacts/benchmark-trend.json
            artifacts/leaderboard.json
            public/leaderboard/**
          if-no-files-found: ignore

  certified-benchmarks:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run internal -- benchmark:certified
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: certified-benchmark-artifacts
          path: artifacts/*.json
          if-no-files-found: error
