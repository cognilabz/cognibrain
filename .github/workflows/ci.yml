name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  verify:
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run verify:ci
      - run: npm run internal -- leaderboard:publish
      - uses: actions/setup-node@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Update npm for trusted publishing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm install -g npm@^11.10.0
      - name: Sync package version with npm
        id: sync-version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/release/sync-npm-package-version.mjs --github-output "$GITHUB_OUTPUT"
      - name: Publish npm package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PACKAGE_NAME="${{ steps.sync-version.outputs.package_name }}"
          NEXT_VERSION="${{ steps.sync-version.outputs.publish_version }}"

          echo "Publishing $PACKAGE_NAME@$NEXT_VERSION to npm."
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not set; using npm trusted publishing via GitHub OIDC."
          fi

          set -o pipefail
          publish_log="$(mktemp)"
          if npm publish --access public 2>&1 | tee "$publish_log"; then
            exit 0
          fi
          publish_status="${PIPESTATUS[0]}"

          if npm view "$PACKAGE_NAME@$NEXT_VERSION" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$NEXT_VERSION is already available on npm; treating publish as complete."
            exit 0
          fi

          if grep -Eq "TLOG_CREATE_ENTRY_ERROR|rekor\.sigstore\.dev" "$publish_log"; then
            echo "npm provenance transparency-log creation failed transiently; retrying publish without provenance."
            if npm publish --access public --provenance=false; then
              exit 0
            fi
            if npm view "$PACKAGE_NAME@$NEXT_VERSION" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
              echo "$PACKAGE_NAME@$NEXT_VERSION is already available on npm after fallback; treating publish as complete."
              exit 0
            fi
          fi

          exit "$publish_status"
      - name: Commit synced package version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.sync-version.outputs.updated == 'true'
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Package files already match the published version."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: sync npm package version to ${{ steps.sync-version.outputs.publish_version }} [skip ci]"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: synthetic-evaluation-report
          path: |
            artifacts/evaluation-report.json
            artifacts/nextgen-eval.json
            artifacts/nextgen-benchmarks.json
            artifacts/answer-generation.json
            artifacts/cognicodebench/*.json
            artifacts/plan1_2-audit.json
            artifacts/plan1_3-audit.json
            artifacts/status-verification.json
            artifacts/vendor-live-smoke.json
            artifacts/selfhosted-verification.json
            artifacts/benchmark-trend.json
            artifacts/leaderboard.json
            public/leaderboard/**
          if-no-files-found: ignore

  certified-benchmarks:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run internal -- benchmark:certified
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: certified-benchmark-artifacts
          path: artifacts/*.json
          if-no-files-found: error
