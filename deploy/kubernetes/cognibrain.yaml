apiVersion: v1
kind: Namespace
metadata:
  name: cognibrain
---
apiVersion: v1
kind: Secret
metadata:
  name: cognibrain-secrets
  namespace: cognibrain
type: Opaque
stringData:
  MEMORY_API_KEYS: "replace-with-random-api-key-list"
  MEMORY_POSTGRES_URL: "postgres://cognibrain:replace-with-secret@postgres.example.com:5432/cognibrain"
  MEMORY_ENCRYPTION_KEY: "replace-with-secret-manager-sync"
  MEMORY_ENCRYPTION_KEY_ID: "org-default"
  MEMORY_ENCRYPTION_KEY_VERSION: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cognibrain
  namespace: cognibrain
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cognibrain
  template:
    metadata:
      labels:
        app: cognibrain
    spec:
      containers:
        - name: cognibrain
          image: ghcr.io/cognilabz/cognibrain:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8787
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8787"
            - name: MEMORY_STORAGE_BACKEND
              value: postgres-remote
            - name: MEMORY_REQUIRE_AUTH
              value: "true"
            - name: MEMORY_DEPLOYMENT_MODE
              value: self_hosted
            - name: MEMORY_PUBLIC_URL
              value: https://memory.example.com
            - name: MEMORY_TLS_TERMINATED_BY
              value: ingress
            - name: MEMORY_KEY_PROVIDER
              value: external
          envFrom:
            - secretRef:
                name: cognibrain-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8787
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8787
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: cognibrain
  namespace: cognibrain
spec:
  selector:
    app: cognibrain
  ports:
    - port: 80
      targetPort: 8787
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cognibrain
  namespace: cognibrain
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  tls:
    - hosts:
        - memory.example.com
      secretName: cognibrain-tls
  rules:
    - host: memory.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cognibrain
                port:
                  number: 80
