<line class="axis" x1="260" y1="404" x2="1020" y2="404"/>
<text class="label" x="60" y="228">LoCoMo</text>
<text class="detail" x="60" y="248">Cognibrain 902/1536</text>
<rect class="bar-baseline" x="260" y="236" width="330.0260416666667" height="14" rx="4"/>
<rect class="bar-cognibrain" x="260" y="214" width="446.30208333333337" height="18" rx="4"/>
<text class="value" x="716.3020833333334" y="228">58.7%</text>
<text class="detail" x="600.0260416666667" y="248">Keyword Only 43.4%</text>
<text class="label" x="60" y="290">LongMemEval-S</text>
<text class="detail" x="60" y="310">Cognibrain 498/500</text>
<rect class="bar-baseline" x="260" y="298" width="752.4" height="14" rx="4"/>
<rect class="bar-cognibrain" x="260" y="276" width="756.96" height="18" rx="4"/>
<text class="value" x="1026.96" y="290">99.6%</text>
<text class="detail" x="1022.4" y="310">Keyword Only 99.0%</text>
<text class="label" x="60" y="352">BEAM</text>
<text class="detail" x="60" y="372">Cognibrain 386/400</text>
