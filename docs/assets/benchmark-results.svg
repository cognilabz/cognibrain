<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1390" viewBox="0 0 1180 1390" role="img" aria-labelledby="title desc">
<title id="title">Cognibrain benchmark results</title>
<desc id="desc">Percent charts comparing current Cognibrain results with public benchmark baselines and Benchmark Arena systems.</desc>
<style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #152033; }
      .title { font-size: 30px; font-weight: 760; }
      .subtitle { font-size: 14px; fill: #586273; }
      .section-title { font-size: 18px; font-weight: 760; }
      .section-note { font-size: 12px; fill: #667085; }
      .label { font-size: 13px; font-weight: 620; }
      .detail { font-size: 11px; fill: #667085; }
      .tick { font-size: 11px; fill: #748094; }
      .value { font-size: 12px; font-weight: 720; }
      .grid { stroke: #dfe5ed; stroke-width: 1; }
      .axis { stroke: #b8c2d0; stroke-width: 1; }
      .panel { fill: #ffffff; stroke: #d9e0ea; stroke-width: 1; }
      .bar-cognibrain { fill: #087f8c; }
      .bar-comparison { fill: #61748a; }
      .bar-baseline { fill: #a7b3c2; }
      .bar-blocked { fill: #d7dde6; }
      .marker { fill: #f59e0b; }
    </style>
<rect width="1180" height="1390" fill="#f6f8fb"/>
<text class="title" x="36" y="46">Benchmark Results</text>
<text class="subtitle" x="36" y="72">Fresh local run, percent scale. Sources: public dataset reports, Benchmark Arena, and CogniCodeBench artifacts.</text>
<text class="subtitle" x="36" y="94">Generated 2026-05-28 UTC; public datasets 12:56Z-12:59Z, arena 12:52Z, cognicode 12:52Z</text>
<rect class="panel" x="36" y="128" width="1108" height="302" rx="10"/>
<text class="section-title" x="60" y="162">Public Benchmark Datasets</text>
<text class="section-note" x="60" y="184">Cognibrain compared with the strongest local baseline on the same public dataset artifact.</text>
