<svg xmlns="http://www.w3.org/2000/svg" width="980" height="720" viewBox="0 0 980 720" role="img" aria-labelledby="title desc">
  <title id="title">Cognibrain benchmark result charts</title>
  <desc id="desc">Bar charts for CogniCodeBench, Arena systems, and selected baselines from the checked benchmark artifacts.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17202a; }
    .title { font-size: 26px; font-weight: 700; }
    .sub { font-size: 13px; fill: #5b6573; }
    .axis { stroke: #c8ced6; stroke-width: 1; }
    .grid { stroke: #edf0f4; stroke-width: 1; }
    .label { font-size: 12px; fill: #344054; }
    .value { font-size: 12px; font-weight: 650; fill: #111827; }
    .section { font-size: 16px; font-weight: 700; }
    .bar-cb { fill: #1f7a8c; }
    .bar-base { fill: #7c8a99; }
    .bar-warn { fill: #c7792b; }
    .bar-muted { fill: #c4ccd5; }
    .panel { fill: #ffffff; stroke: #d7dde5; stroke-width: 1; rx: 8; }
  </style>
  <rect width="980" height="720" fill="#f8fafc"/>
  <text class="title" x="36" y="42">Benchmark Results</text>
  <text class="sub" x="36" y="66">Checked artifacts generated on 2026-05-28 from artifacts/cognicodebench/run.json and artifacts/arena/run.json.</text>

  <rect class="panel" x="28" y="92" width="924" height="156"/>
  <text class="section" x="52" y="124">CogniCodeBench core metrics</text>
  <line class="grid" x1="210" y1="146" x2="905" y2="146"/>
  <line class="grid" x1="210" y1="176" x2="905" y2="176"/>
  <line class="grid" x1="210" y1="206" x2="905" y2="206"/>
  <line class="axis" x1="210" y1="222" x2="905" y2="222"/>
  <text class="label" x="52" y="153">Correction carry-over</text>
  <rect class="bar-cb" x="210" y="139" width="650" height="18" rx="3"/>
  <text class="value" x="872" y="153">1.000</text>
  <text class="label" x="52" y="183">Patch correctness</text>
  <rect class="bar-cb" x="210" y="169" width="650" height="18" rx="3"/>
  <text class="value" x="872" y="183">1.000</text>
  <text class="label" x="52" y="213">Wrong-memory suppression</text>
  <rect class="bar-cb" x="210" y="199" width="650" height="18" rx="3"/>
  <text class="value" x="872" y="213">1.000</text>

  <rect class="panel" x="28" y="272" width="924" height="220"/>
  <text class="section" x="52" y="304">Benchmark Arena system scores</text>
  <text class="label" x="52" y="334">Cognibrain</text>
  <rect class="bar-cb" x="190" y="320" width="632" height="18" rx="3"/>
  <text class="value" x="835" y="334">0.972</text>
  <text class="label" x="52" y="362">Graphiti/Zep</text>
  <rect class="bar-base" x="190" y="348" width="433" height="18" rx="3"/>
  <text class="value" x="636" y="362">0.667</text>
  <text class="label" x="52" y="390">Zep</text>
  <rect class="bar-base" x="190" y="376" width="433" height="18" rx="3"/>
  <text class="value" x="636" y="390">0.667</text>
  <text class="label" x="52" y="418">GBrain</text>
  <rect class="bar-base" x="190" y="404" width="433" height="18" rx="3"/>
  <text class="value" x="636" y="418">0.667</text>
  <text class="label" x="52" y="446">Cognee</text>
  <rect class="bar-base" x="190" y="432" width="390" height="18" rx="3"/>
  <text class="value" x="593" y="446">0.600</text>
  <text class="label" x="52" y="474">Mem0</text>
  <rect class="bar-warn" x="190" y="460" width="98" height="18" rx="3"/>
  <text class="value" x="301" y="474">0.150</text>

  <rect class="panel" x="28" y="516" width="924" height="164"/>
  <text class="section" x="52" y="548">Selected baseline scores</text>
  <text class="label" x="52" y="578">Procedure only</text>
  <rect class="bar-base" x="210" y="564" width="325" height="18" rx="3"/>
  <text class="value" x="548" y="578">0.500</text>
  <text class="label" x="52" y="606">Keyword only</text>
  <rect class="bar-base" x="210" y="592" width="216" height="18" rx="3"/>
  <text class="value" x="439" y="606">0.333</text>
  <text class="label" x="52" y="634">Graph only</text>
  <rect class="bar-base" x="210" y="620" width="191" height="18" rx="3"/>
  <text class="value" x="414" y="634">0.294</text>
  <text class="label" x="52" y="662">No memory</text>
  <rect class="bar-muted" x="210" y="648" width="4" height="18" rx="3"/>
  <text class="value" x="228" y="662">0.000</text>
</svg>
